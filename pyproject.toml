[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellscope"
version = "0.1.0"
description = "A desktop application for single-cell RNA sequencing analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.1"]

[project.gui-scripts]
cellscope = "cellscope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
